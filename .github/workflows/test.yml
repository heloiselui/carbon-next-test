name: Test Carbon next

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to test (ignored when ref is set)
        type: string
        default: v12-alpha
      ref:
        description: Upstream git tag or commit to read the release set from
        type: string
        required: false

concurrency:
  group:
    test-${{ github.event_name }}-${{ github.event.client_payload.ref ||
    github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release set
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      key: ${{ steps.key.outputs.key }}
      tested: ${{ steps.tested.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Download unpublished tarballs
        if: github.event.client_payload.run_id
        env:
          GH_TOKEN: ${{ secrets.CARBON_REPO_TOKEN }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
        run: |
          case "$RUN_ID" in
            ''|*[!0-9]*) echo 'Expected a numeric workflow run ID' >&2; exit 1 ;;
          esac
          gh run download "$RUN_ID" --repo carbon-design-system/carbon \
            --name carbon-tarballs --dir carbon-tarballs
      - name: Resolve
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ inputs.tag || 'v12-alpha' }}
          REF: ${{ inputs.ref || github.event.client_payload.ref }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ -n "$RUN_ID" ]; then
              node scripts/use-carbon.mjs --tarballs carbon-tarballs --git-ref "$REF"
            elif [ -n "$REF" ]; then
              node scripts/use-carbon.mjs --ref "$REF"
            else
              node scripts/use-carbon.mjs --tag "$TAG"
            fi
          fi
          {
            echo '## Release set'
            echo '```json'
            cat carbon-release.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cache key
        id: key
        run:
          echo "key=tested-${{ hashFiles('carbon-release.json', 'yarn.lock',
          '.yarn/releases/**', 'apps/**', 'tests/**', 'scripts/**') }}" >>
          "$GITHUB_OUTPUT"
      - name: Check whether this set already passed
        id: tested
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: carbon-release.json
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            carbon-release.json
            carbon-tarballs/
          if-no-files-found: ignore

  contract:
    name: Package contract
    needs: resolve
    if: needs.resolve.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/install
        with:
          react: 19
          immutable: ${{ github.event_name != 'workflow_dispatch' }}
      - run: node .yarn/releases/yarn-4.10.3.cjs test:contract
      - name: Report public API changes
        if: always()
        run:
          cat reports/api-diff.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Preserve contract reports
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-report
          path: |
            carbon-release.json
            yarn.lock
            reports/

  apps:
    name: Apps (React ${{ matrix.react }})
    needs: resolve
    if: needs.resolve.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - react: 19
            apps: react-vite,react-nextjs,web-components-vite,web-components-webpack,styles-sass
          # Next.js 16 requires React 19, and the other apps do not use React.
          - react: 18
            apps: react-vite
    env:
      APPS: ${{ matrix.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/install
        with:
          react: ${{ matrix.react }}
          immutable:
            ${{ github.event_name != 'workflow_dispatch' && matrix.react == 19
            }}
      - name: Build
        run: |
          for app in ${APPS//,/ }; do
            echo "::group::$app"
            node .yarn/releases/yarn-4.10.3.cjs workspace "@carbon-next-test/$app" build
            echo "::endgroup::"
          done
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Report Sass build
        if: always() && !cancelled()
        run: cat reports/sass.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Unit tests
        run: node .yarn/releases/yarn-4.10.3.cjs test:unit
      - name: Install Playwright
        run:
          node .yarn/releases/yarn-4.10.3.cjs workspace @carbon-next-test/e2e
          playwright install --with-deps chromium
      - name: End-to-end tests
        run: |
          export APPS="$(echo "$APPS" | tr ',' '\n' | grep -v '^styles-sass$' | paste -sd, -)"
          node .yarn/releases/yarn-4.10.3.cjs test:e2e
      - name: Preserve app reports
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-report-react-${{ matrix.react }}
          path: |
            carbon-release.json
            yarn.lock
            reports/
            tests/e2e/playwright-report/
            tests/e2e/test-results/

  report:
    name: Report
    needs: [resolve, contract, apps]
    if: always() && !cancelled() && needs.resolve.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Result
        id: result
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          APPS_RESULT: ${{ needs.apps.result }}
        run: |
          if [ "$RESOLVE_RESULT" = success ] && [ "$CONTRACT_RESULT" = success ] && [ "$APPS_RESULT" = success ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
          else
            echo "state=failure" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.result.outputs.state == 'success'
        with:
          name: release
      - name: Remember that this set passed
        if: steps.result.outputs.state == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: carbon-release.json
          key: ${{ needs.resolve.outputs.key }}
      - name: Report status upstream
        if: >-
          always() && !cancelled() && github.repository ==
          'carbon-design-system/carbon-next-test' && vars.ENABLE_UPSTREAM_STATUS
          == 'true' && github.event_name == 'repository_dispatch' &&
          github.event.client_payload.sha
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.CARBON_REPO_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: 'carbon-design-system',
              repo: 'carbon',
              sha: context.payload.client_payload.sha,
              state: '${{ steps.result.outputs.state }}',
              context: 'carbon-next-test',
              description: 'Published packages in consumer apps',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Notify Slack
        if: >-
          always() && !cancelled() && github.repository ==
          'carbon-design-system/carbon-next-test' &&
          vars.ENABLE_SLACK_NOTIFICATIONS == 'true' &&
          steps.result.outputs.state == 'failure' && github.event_name !=
          'pull_request'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RELEASE_REF:
            ${{ github.event.client_payload.ref || inputs.ref || inputs.tag ||
            'v12-alpha' }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo 'SLACK_WEBHOOK_URL is required when Slack notifications are enabled' >&2
            exit 1
          fi
          payload=$(node -e 'process.stdout.write(JSON.stringify({text: `carbon-next-test failed for ${process.env.RELEASE_REF}: ${process.env.RUN_URL}`}))')
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST -H 'Content-type: application/json' \
            --data "$payload" "$SLACK_WEBHOOK_URL"
      - name: Enforce test result
        if: always() && !cancelled()
        env:
          TEST_STATE: ${{ steps.result.outputs.state }}
        run: test "$TEST_STATE" = success
