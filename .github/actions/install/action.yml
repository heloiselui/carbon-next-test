name: Install release set
description:
  Installs committed dependencies or applies the release set from the resolve
  job
inputs:
  react:
    description: React major version
    required: true
  immutable:
    description:
      Install the committed catalog and lockfile without rewriting them
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release
        path: .release
    - name: Install
      shell: bash
      env:
        REACT: ${{ inputs.react }}
        IMMUTABLE: ${{ inputs.immutable }}
      run: |
        if [ "$IMMUTABLE" = true ]; then
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const release = JSON.parse(fs.readFileSync("carbon-release.json", "utf8"));
            assert.equal(release.react, Number(process.env.REACT), "Committed React major does not match the job");
          '
          node .yarn/releases/yarn-4.10.3.cjs install --immutable
          git diff --exit-code -- carbon-release.json .yarnrc.yml yarn.lock package.json
        else
          if [ -d .release/carbon-tarballs ]; then mv .release/carbon-tarballs carbon-tarballs; fi
          node scripts/use-carbon.mjs --release .release/carbon-release.json --react "$REACT"
          YARN_ENABLE_IMMUTABLE_INSTALLS=false node .yarn/releases/yarn-4.10.3.cjs install
        fi
